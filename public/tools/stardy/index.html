<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stardy · 学习系统 — Michael</title>
  <meta name="description" content="Anki 式学习闭环：上传课件与资料（PDF / PPT / Word / 扫描件 OCR），AI 提取知识体系并经人工审核生成知识树，问答闪卡、挖空卡、选择题与简答 AI 批改四位一体，FSRS-6 间隔重复调度复习，进度本地持久 + 云端备份。">
  <meta name="theme-color" content="#0a0a0b">
  <meta name="color-scheme" content="dark light">
  <link rel="icon" type="image/svg+xml" href="../../assets/img/favicon.svg">
  <script>
    /* 首帧前定下主题，避免闪烁。
       与主站共用 localStorage 的 theme / hue 两个键：
       theme ∈ {light, dark, system}；hue 是 0-360 的主题色相。
       同时写 data-theme（部分工具的自有 CSS 仍在用）和 .dark（tool-shell 用）。 */
    (function () {
      var DARK = 'dark', LIGHT = 'light', SYS = 'system';
      var t = null, hue = null;
      try {
        t = localStorage.getItem('theme');
        hue = localStorage.getItem('hue');
      } catch (e) {}
      if (t !== DARK && t !== LIGHT) t = SYS;
      var sysDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      var dark = t === DARK || (t === SYS && sysDark);
      document.documentElement.classList.toggle('dark', dark);
      document.documentElement.dataset.theme = dark ? DARK : LIGHT;
      document.documentElement.classList.add('js');
      if (hue) document.documentElement.style.setProperty('--hue', hue);
      var m = document.querySelector('meta[name="theme-color"]');
      if (m) m.content = dark ? '#12181a' : '#f2f5f4';
    })();
  </script>
  <link rel="stylesheet" href="../../assets/css/tool-shell.css">
  <link rel="stylesheet" href="../../assets/vendor/katex/katex.min.css">
  <link rel="stylesheet" href="css/stardy.css?v=7">
  <style>
    .tool {
      padding-top: calc(var(--nav-h) + clamp(40px, 7vw, 72px));
      padding-bottom: 0;
    }
    .tool__head { max-width: 760px; margin-bottom: 18px; }
    .tool__head h1 { font-size: var(--fs-h1); letter-spacing: -0.02em; margin-top: 22px; }
    .tool__head p { margin-top: 14px; color: var(--text-2); line-height: 1.7; }
    @media (max-width: 640px) {
      .tool__head h1 { font-size: clamp(28px, 8vw, 36px); }
    }
  </style>
</head>
<body class="sdy-page">

  <a class="tool-back" href="/tools/">
    <span class="tool-back__arrow" aria-hidden="true">&larr;</span>
    <span>全部工具</span>
  </a>
  <button class="tool-theme" id="tool-theme" type="button" aria-label="切换深浅色" title="切换深浅色">
    <svg class="tool-theme__sun" viewBox="0 0 24 24" aria-hidden="true">
      <circle cx="12" cy="12" r="4"/>
      <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/>
    </svg>
    <svg class="tool-theme__moon" viewBox="0 0 24 24" aria-hidden="true">
      <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
    </svg>
  </button>

  <!-- SPA 挂载点：路由把视图渲染进这里 -->
  <main id="main"></main>

  <!-- 全屏复习层（复用棋乐馆的全屏视图模式） -->
  <div class="sdy-review" id="sdy-review" hidden></div>

  <!-- 全局轻提示 -->
  <div class="sdy-toast" id="sdy-toast" hidden></div>

  <!-- ===== 脚本 ===== -->
  <script src="../../assets/vendor/katex/katex.min.js"></script>
  <script src="../../assets/vendor/katex/contrib/auto-render.min.js"></script>
  <script type="module" src="js/app.js?v=5"></script>
  <script>
    /* 主题切换：写回主站同一套 localStorage 键，回到主站后主题保持一致 */
    (function () {
      var btn = document.getElementById('tool-theme');
      if (!btn) return;
      function apply(dark) {
        var root = document.documentElement;
        root.classList.toggle('dark', dark);
        root.dataset.theme = dark ? 'dark' : 'light';
        var m = document.querySelector('meta[name="theme-color"]');
        if (m) m.content = dark ? '#12181a' : '#f2f5f4';
        try { localStorage.setItem('theme', dark ? 'dark' : 'light'); } catch (e) {}
      }
      btn.addEventListener('click', function () {
        apply(!document.documentElement.classList.contains('dark'));
      });
    })();
  </script>
</body>
</html>
