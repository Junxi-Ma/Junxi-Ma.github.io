<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stardy · 大气探测学 — Michael</title>
  <meta name="description" content="大气探测学知识卡片 — 背诵与问答复习工具">
  <meta name="theme-color" content="#0a0a0b">
  <meta name="color-scheme" content="dark">
  <link rel="icon" type="image/svg+xml" href="../../assets/img/favicon.svg">
  <link rel="stylesheet" href="../../assets/css/tool-shell.css">
  <link rel="stylesheet" href="../../assets/vendor/katex/katex.min.css">
  <link rel="stylesheet" href="stardy.css">
  <script>
    /* 首帧前定下主题，避免闪烁。
       与主站共用 localStorage 的 theme / hue 两个键：
       theme ∈ {light, dark, system}；hue 是 0-360 的主题色相。
       同时写 data-theme（部分工具的自有 CSS 仍在用）和 .dark（tool-shell 用）。 */
    (function () {
      var DARK = 'dark', LIGHT = 'light', SYS = 'system';
      var t = null, hue = null;
      try {
        t = localStorage.getItem('theme');
        hue = localStorage.getItem('hue');
      } catch (e) {}
      if (t !== DARK && t !== LIGHT) t = SYS;
      var sysDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      var dark = t === DARK || (t === SYS && sysDark);
      document.documentElement.classList.toggle('dark', dark);
      document.documentElement.dataset.theme = dark ? DARK : LIGHT;
      document.documentElement.classList.add('js');
      if (hue) document.documentElement.style.setProperty('--hue', hue);
      var m = document.querySelector('meta[name="theme-color"]');
      if (m) m.content = dark ? '#12181a' : '#f2f5f4';
    })();
  </script>
</head>
<body>

  <!-- ===== 导航 ===== -->
  <a class="tool-back" href="/tools/">
    <span class="tool-back__arrow" aria-hidden="true">&larr;</span>
    <span>全部工具</span>
  </a>
  <button class="tool-theme" id="tool-theme" type="button" aria-label="切换深浅色" title="切换深浅色">
    <svg class="tool-theme__sun" viewBox="0 0 24 24" aria-hidden="true">
      <circle cx="12" cy="12" r="4"/>
      <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/>
    </svg>
    <svg class="tool-theme__moon" viewBox="0 0 24 24" aria-hidden="true">
      <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
    </svg>
  </button>

  <main id="main">

    <!-- ===== 顶部标题区 ===== -->
    <div class="sdy-hero">
      <div class="container">
        <div class="sdy-hero__breadcrumb">
          <a href="/tools/">工具</a>
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m9 18 6-6-6-6"/></svg>
          <span>Stardy</span>
        </div>
        <div class="sdy-hero__top">
          <div>
            <h1 class="sdy-hero__title">大气探测学</h1>
            <p class="sdy-hero__sub">15 章节 · <span id="total-count">0</span> 张知识卡片</p>
          </div>
          <div class="sdy-hero__stats" id="stats-panel">
            <div class="sdy-stat">
              <span class="sdy-stat__num" id="stat-studied">0</span>
              <span class="sdy-stat__label">已学</span>
            </div>
            <div class="sdy-stat">
              <span class="sdy-stat__num" id="stat-mastered">0</span>
              <span class="sdy-stat__label">已掌握</span>
            </div>
            <div class="sdy-stat">
              <span class="sdy-stat__num" id="stat-streak">0</span>
              <span class="sdy-stat__label">连续天</span>
            </div>
          </div>
        </div>

        <!-- 模式切换 -->
        <div class="sdy-mode-bar">
          <button class="sdy-mode-btn active" data-mode="browse" id="btn-browse">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
            浏览
          </button>
          <button class="sdy-mode-btn" data-mode="study" id="btn-study">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>
            背诵
          </button>
          <button class="sdy-mode-btn" data-mode="quiz" id="btn-quiz">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><path d="M12 17h.01"/></svg>
            问答
          </button>
        </div>
      </div>
    </div>

    <!-- ===== 浏览模式 ===== -->
    <div class="sdy-view" id="view-browse">
      <div class="container">

        <!-- 章节过滤 -->
        <div class="sdy-chapters" id="chapter-list" role="group" aria-label="按章节筛选">
          <button class="sdy-ch-btn active" data-ch="all">全部</button>
          <!-- 章节按钮由 JS 生成 -->
        </div>

        <!-- 卡片网格 -->
        <div class="sdy-grid" id="cards-grid" role="list">
          <!-- 骨架屏 -->
          <div class="sdy-skel"></div>
          <div class="sdy-skel"></div>
          <div class="sdy-skel"></div>
        </div>

      </div>
    </div>

    <!-- ===== 背诵模式 ===== -->
    <div class="sdy-view hidden" id="view-study">
      <div class="container sdy-study-wrap">

        <!-- 进度条 -->
        <div class="sdy-progress-track">
          <div class="sdy-progress-bar" id="progress-bar"></div>
        </div>
        <p class="sdy-progress-text"><span id="prog-cur">1</span> / <span id="prog-total">0</span></p>

        <!-- 章节选择 -->
        <div class="sdy-study-filter">
          <label class="sdy-label">学习范围</label>
          <select class="sdy-select" id="study-chapter-sel">
            <option value="all">全部章节</option>
          </select>
          <button class="sdy-btn sdy-btn--ghost" id="btn-shuffle">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 3h5v5M4 20 21 3"/><path d="M21 16v5h-5M15 15l6 6"/><path d="M4 4l5 5"/></svg>
            随机
          </button>
        </div>

        <!-- 闪卡 -->
        <div class="sdy-flashcard-wrap" id="flashcard-wrap">
          <div class="sdy-flashcard" id="flashcard" role="button" tabindex="0" aria-label="点击翻转卡片">
            <div class="sdy-flashcard__inner" id="flashcard-inner">
              <!-- 正面 -->
              <div class="sdy-flashcard__face sdy-flashcard__front">
                <div class="sdy-flashcard__chapter-tag" id="fc-chapter">章节</div>
                <div class="sdy-flashcard__content" id="fc-front">
                  <p>加载中…</p>
                </div>
                <div class="sdy-flashcard__hint">
                  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m3 12 9-9 9 9M5 10v10a1 1 0 0 0 1 1h4v-5h4v5h4a1 1 0 0 0 1-1V10"/></svg>
                  点击查看答案
                </div>
              </div>
              <!-- 背面 -->
              <div class="sdy-flashcard__face sdy-flashcard__back">
                <div class="sdy-flashcard__chapter-tag" id="fc-chapter-b">章节</div>
                <h3 class="sdy-flashcard__back-title" id="fc-title">标题</h3>
                <div class="sdy-flashcard__content sdy-flashcard__content--back" id="fc-back">
                  <p>加载中…</p>
                </div>
              </div>
            </div>
          </div>
        </div>

        <!-- 操作按钮 -->
        <div class="sdy-fc-actions" id="fc-actions">
          <button class="sdy-fc-btn sdy-fc-btn--no" id="btn-wrong" disabled>
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M18 6 6 18M6 6l12 12"/></svg>
            还不会
          </button>
          <button class="sdy-fc-btn sdy-fc-btn--skip" id="btn-skip" disabled>
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m9 18 6-6-6-6"/></svg>
            跳过
          </button>
          <button class="sdy-fc-btn sdy-fc-btn--ok" id="btn-correct" disabled>
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M20 6 9 17l-5-5"/></svg>
            记住了
          </button>
        </div>

        <!-- 挖空模式开关 -->
        <div class="sdy-cloze-toggle-wrap">
          <label class="sdy-switch" for="cloze-toggle">
            <input type="checkbox" id="cloze-toggle">
            <span class="sdy-switch__track"></span>
            <span class="sdy-switch__label">挖空背诵</span>
          </label>
          <span class="sdy-switch__hint">开启后卡片背面关键词将被隐藏，点击逐个揭示</span>
        </div>

      </div>
    </div>

    <!-- ===== 问答模式 ===== -->
    <div class="sdy-view hidden" id="view-quiz">
      <div class="container sdy-quiz-wrap">

        <!-- 题目区 -->
        <div class="sdy-quiz-header">
          <div class="sdy-quiz-meta">
            <span id="quiz-num">1</span> / <span id="quiz-total">0</span>
            <span class="sdy-quiz-score">得分 <strong id="quiz-score">0</strong></span>
          </div>
          <button class="sdy-btn sdy-btn--ghost sdy-btn--sm" id="btn-new-quiz">换一批</button>
        </div>

        <div class="sdy-quiz-card" id="quiz-card">
          <div class="sdy-quiz-q" id="quiz-question">
            <p>点击"开始"进入问答模式</p>
          </div>

          <div class="sdy-quiz-options" id="quiz-options" role="group" aria-label="选项">
            <!-- 选项由 JS 生成 -->
          </div>

          <div class="sdy-quiz-feedback hidden" id="quiz-feedback">
            <div class="sdy-quiz-feedback__inner" id="quiz-feedback-inner"></div>
            <button class="sdy-btn sdy-btn--primary" id="btn-next-q">下一题 →</button>
          </div>
        </div>

        <button class="sdy-btn sdy-btn--primary sdy-quiz-start" id="btn-start-quiz">开始问答</button>

      </div>
    </div>

  </main>

  <!-- ===== 卡片详情 Modal ===== -->
  <div class="sdy-modal-overlay hidden" id="card-modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <div class="sdy-modal">
      <button class="sdy-modal__close" id="modal-close" aria-label="关闭">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18M6 6l12 12"/></svg>
      </button>
      <div class="sdy-modal__chapter-tag" id="modal-chapter">章节</div>
      <h2 class="sdy-modal__title" id="modal-title">标题</h2>
      <div class="sdy-modal__front" id="modal-front"></div>
      <div class="sdy-modal__divider"></div>
      <div class="sdy-modal__back" id="modal-back"></div>
      <div class="sdy-modal__actions">
        <button class="sdy-btn sdy-btn--ghost sdy-btn--sm" id="modal-prev">← 上一张</button>
        <button class="sdy-btn sdy-btn--primary sdy-btn--sm" id="modal-study-this">开始背诵此卡</button>
        <button class="sdy-btn sdy-btn--ghost sdy-btn--sm" id="modal-next">下一张 →</button>
      </div>
    </div>
  </div>

  <!-- ===== Footer ===== -->

  <!-- ===== 脚本 ===== -->
  <script src="../../assets/vendor/katex/katex.min.js"></script>
  <script src="../../assets/vendor/katex/contrib/auto-render.min.js"></script>
  <script src="stardy.js" type="module"></script>
  <script>
    /* 主题切换：写回主站同一套 localStorage 键，回到主站后主题保持一致 */
    (function () {
      var btn = document.getElementById('tool-theme');
      if (!btn) return;
      function apply(dark) {
        var root = document.documentElement;
        root.classList.toggle('dark', dark);
        root.dataset.theme = dark ? 'dark' : 'light';
        var m = document.querySelector('meta[name="theme-color"]');
        if (m) m.content = dark ? '#12181a' : '#f2f5f4';
        try { localStorage.setItem('theme', dark ? 'dark' : 'light'); } catch (e) {}
      }
      btn.addEventListener('click', function () {
        apply(!document.documentElement.classList.contains('dark'));
      });
    })();
  </script>
</body>
</html>
