<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>云的分类速记 — Michael</title>
  <meta name="description" content="大气探测学云的分类与识别：三族十属二十九类速记表可遮罩自测；测验支持说法判断多选、成因演变、谚语对应、视张角判别、看图识云五类新课型，错题自动留存本机。">
  <meta name="theme-color" content="#0a0a0b">
  <meta name="color-scheme" content="dark">
  <link rel="icon" type="image/svg+xml" href="../../assets/img/favicon.svg">
  <script>
    /* 首帧前定下主题，避免闪烁。
       与主站共用 localStorage 的 theme / hue 两个键：
       theme ∈ {light, dark, system}；hue 是 0-360 的主题色相。
       同时写 data-theme（部分工具的自有 CSS 仍在用）和 .dark（tool-shell 用）。 */
    (function () {
      var DARK = 'dark', LIGHT = 'light', SYS = 'system';
      var t = null, hue = null;
      try {
        t = localStorage.getItem('theme');
        hue = localStorage.getItem('hue');
      } catch (e) {}
      if (t !== DARK && t !== LIGHT) t = SYS;
      var sysDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      var dark = t === DARK || (t === SYS && sysDark);
      document.documentElement.classList.toggle('dark', dark);
      document.documentElement.dataset.theme = dark ? DARK : LIGHT;
      document.documentElement.classList.add('js');
      if (hue) document.documentElement.style.setProperty('--hue', hue);
      var m = document.querySelector('meta[name="theme-color"]');
      if (m) m.content = dark ? '#12181a' : '#f2f5f4';
    })();
  </script>
  <link rel="stylesheet" href="../../assets/css/tool-shell.css">
  <link rel="stylesheet" href="style.css?v=5">
  <link rel="stylesheet" href="../../assets/css/site-gate.css">
  <script>document.documentElement.dataset.gateCheck = "1";</script>
</head>
<body>

  <a class="tool-back" href="/tools/">
    <span class="tool-back__arrow" aria-hidden="true">&larr;</span>
    <span>全部工具</span>
  </a>
  <button class="tool-theme" id="tool-theme" type="button" aria-label="切换深浅色" title="切换深浅色">
    <svg class="tool-theme__sun" viewBox="0 0 24 24" aria-hidden="true">
      <circle cx="12" cy="12" r="4"/>
      <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/>
    </svg>
    <svg class="tool-theme__moon" viewBox="0 0 24 24" aria-hidden="true">
      <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
    </svg>
  </button>

  <main id="main">
    <div class="container tool">
      <div class="tool__head">
        <p class="mono-label">Tool <span>/</span> 06</p>
        <h1>云的分类速记</h1>
        <p>大气探测学第一关：三族、十属、二十九类。速记表支持遮罩自测；测验覆盖词根速记、特征说法多选、成因演变、谚语对应、视张角判别、看图识云，答错自动重排，错题本存在本机浏览器。</p>
      </div>

      <div class="cq-toolbar">
        <div class="cq-tabs" role="tablist" aria-label="模式切换">
          <button class="cq-tab is-active" data-tab="learn" type="button">速记表</button>
          <button class="cq-tab" data-tab="quiz" type="button">测验</button>
        </div>
        <span class="cq-stats" id="cq-stats" aria-live="polite"></span>
      </div>

      <!-- ================= 速记表 ================= -->
      <div id="cq-learn-wrap">
        <div class="cq-sky" id="cq-sky"></div>
        <div class="cq-mask-hint" style="margin: 16px 0 14px;">
          <span>遮罩自测：</span>
          <label><input type="checkbox" id="mask-abbr"> 挡住英文简写</label>
          <label><input type="checkbox" id="mask-latin"> 挡住拉丁学名</label>
          <button class="btn btn--ghost btn--sm" id="mask-reveal" type="button">全部揭开</button>
          <button class="btn btn--ghost btn--sm" id="mask-reset" type="button">重新遮住</button>
          <span>点被挡住的格子即可揭底</span>
        </div>
        <div id="cq-learn"></div>
      </div>

      <!-- ================= 测验 ================= -->
      <div id="cq-quiz-wrap" hidden>
        <div class="cq-panel" id="cq-config">
          <div class="cq-config-row">
            <label>题型
              <select class="cq-select" id="cq-mode">
                <option value="all" selected>全科混合</option>
                <option value="species">云类速记（简写 ↔ 中文 ↔ 拉丁）</option>
                <option value="genus">云属框架（族属 · 简写 · 形态）</option>
                <option value="judge">特征说法与成因（含多选）</option>
                <option value="proverb">谚语对应</option>
                <option value="angle">视张角判别</option>
                <option value="scene">看图识云</option>
              </select>
            </label>
          </div>
          <div class="cq-config-row">
            <label>范围
              <select class="cq-select" id="cq-family">
                <option value="all" selected>全部</option>
                <option value="high">高云</option>
                <option value="mid">中云</option>
                <option value="low">低云</option>
              </select>
            </label>
            <label>题数
              <select class="cq-select" id="cq-count">
                <option value="10" selected>10</option>
                <option value="20">20</option>
                <option value="40">40</option>
              </select>
            </label>
          </div>
          <div class="cq-config-row" style="margin-bottom: 0;">
            <button class="btn btn--primary" id="cq-start" type="button">开始测验</button>
            <button class="btn btn--ghost" id="cq-wrong-mode" type="button">错题重练</button>
            <button class="btn btn--ghost" id="cq-clear-wrong" type="button">清空错题本</button>
          </div>
          <p class="cq-fam-morph" style="margin-top: 16px;">键盘：1–6 / A–F 选答案（多选题为勾选），Enter 确认或下一题。多选题要选得和正确答案完全一致才得分；答错的题本轮内会自动重排，直到答对；并记入错题本。</p>
        </div>

        <div id="cq-stage" hidden>
          <div class="cq-stage-head">
            <span class="cq-progress" id="cq-progress"></span>
            <span class="cq-score" id="cq-score"></span>
            <span class="cq-type-tag" id="cq-type-tag"></span>
          </div>
          <div class="cq-progressbar" aria-hidden="true"><i id="cq-progressbar-fill"></i></div>
          <div class="cq-prompt-card">
            <div class="cq-scene" id="cq-scene" hidden></div>
            <div class="cq-prompt" id="cq-prompt"></div>
            <div class="cq-prompt-sub" id="cq-prompt-sub"></div>
          </div>
          <div class="cq-options" id="cq-options"></div>
          <div class="cq-feedback" id="cq-feedback" hidden></div>
          <div class="cq-next-row">
            <button class="btn btn--primary" id="cq-next" type="button" hidden>下一题（Enter）</button>
            <button class="btn btn--ghost cq-quit-row" id="cq-quit" type="button">结束本轮</button>
          </div>
        </div>

        <div class="cq-panel cq-summary" id="cq-summary" hidden>
          <h3 id="cq-summary-title"></h3>
          <p class="cq-summary-praise" id="cq-summary-praise"></p>
          <div id="cq-summary-wrong"></div>
          <div class="cq-summary-actions">
            <button class="btn btn--primary" id="cq-again" type="button">再来一轮（Enter）</button>
            <button class="btn btn--ghost" id="cq-back" type="button">返回配置</button>
          </div>
        </div>
      </div>
    </div>
  </main>
  <script src="data.js?v=4"></script>
  <script src="app.js?v=6"></script>
  <script type="module" src="../../assets/js/site-gate.js"></script>
  <script>
    /* 主题切换：写回主站同一套 localStorage 键，回到主站后主题保持一致 */
    (function () {
      var btn = document.getElementById('tool-theme');
      if (!btn) return;
      function apply(dark) {
        var root = document.documentElement;
        root.classList.toggle('dark', dark);
        root.dataset.theme = dark ? 'dark' : 'light';
        var m = document.querySelector('meta[name="theme-color"]');
        if (m) m.content = dark ? '#12181a' : '#f2f5f4';
        try { localStorage.setItem('theme', dark ? 'dark' : 'light'); } catch (e) {}
      }
      btn.addEventListener('click', function () {
        apply(!document.documentElement.classList.contains('dark'));
      });
    })();
  </script>
</body>
</html>
