<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>纸感数独 — Michael</title>
  <meta name="description" content="现代纸感数独：入门到专家四档唯一解棋盘，铅笔笔记、提示、撤销与三次失误上限；成绩自动署名上云，英雄榜每人只计最快。">
  <meta name="theme-color" content="#0a0a0b">
  <meta name="color-scheme" content="dark light">
  <link rel="icon" type="image/svg+xml" href="../../assets/img/favicon.svg">
  <script>
    /* 首帧前定下主题，避免闪烁。
       与主站共用 localStorage 的 theme / hue 两个键：
       theme ∈ {light, dark, system}；hue 是 0-360 的主题色相。
       同时写 data-theme（部分工具的自有 CSS 仍在用）和 .dark（tool-shell 用）。 */
    (function () {
      var DARK = 'dark', LIGHT = 'light', SYS = 'system';
      var t = null, hue = null;
      try {
        t = localStorage.getItem('theme');
        hue = localStorage.getItem('hue');
      } catch (e) {}
      if (t !== DARK && t !== LIGHT) t = SYS;
      var sysDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      var dark = t === DARK || (t === SYS && sysDark);
      document.documentElement.classList.toggle('dark', dark);
      document.documentElement.dataset.theme = dark ? DARK : LIGHT;
      document.documentElement.classList.add('js');
      if (hue) document.documentElement.style.setProperty('--hue', hue);
      var m = document.querySelector('meta[name="theme-color"]');
      if (m) m.content = dark ? '#12181a' : '#f2f5f4';
    })();
  </script>
  <link rel="stylesheet" href="../../assets/css/tool-shell.css">
  <link rel="stylesheet" href="style.css?v=3">
  <style>
    /* ---- 页面骨架：与 json-formatter 逐字一致，顶距内联提供 ---- */
    .tool {
      padding-top: calc(var(--nav-h) + clamp(40px, 7vw, 72px));
      padding-bottom: var(--section-y);
    }
    .tool__head {
      max-width: 720px;
      margin-bottom: 32px;
    }
    .tool__head h1 {
      font-size: var(--fs-h1);
      letter-spacing: -0.02em;
      margin-top: 22px;
    }
    .tool__head p {
      margin-top: 14px;
      color: var(--text-2);
      line-height: 1.7;
    }
    @media (max-width: 640px) {
      .tool__head h1 {
        font-size: clamp(28px, 8vw, 36px);
      }
    }
  </style>
  <link rel="stylesheet" href="../../assets/css/site-gate.css">
  <script>document.documentElement.dataset.gateCheck = "1";</script>
</head>
<body class="sk-page">

  <a class="tool-back" href="/tools/">
    <span class="tool-back__arrow" aria-hidden="true">&larr;</span>
    <span>全部工具</span>
  </a>
  <button class="tool-theme" id="tool-theme" type="button" aria-label="切换深浅色" title="切换深浅色">
    <svg class="tool-theme__sun" viewBox="0 0 24 24" aria-hidden="true">
      <circle cx="12" cy="12" r="4"/>
      <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/>
    </svg>
    <svg class="tool-theme__moon" viewBox="0 0 24 24" aria-hidden="true">
      <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
    </svg>
  </button>

  <main id="main">
    <div class="container tool">
      <div class="tool__head">
        <p class="mono-label">Tool <span>/</span> 08</p>
        <h1>纸感数独</h1>
        <p>现代纸感设计的数独棋盘：四档难度全部唯一解，铅笔笔记、提示、撤销与三次失误上限。登录后成绩自动署名上云，右侧英雄榜收录全站四档的最快纪录；手机与平板点按即可作答。</p>
      </div>

      <div class="sk-layout">
        <div class="sk-stage">
          <!-- 纸张质感的数独纸 -->
          <div class="sk-sheet" id="sk-sheet">
            <header class="sk-head">
              <span class="sk-diff" id="sk-diff-label">入门</span>
              <span class="sk-timer" id="sk-timer">00:00</span>
              <span class="sk-lives" id="sk-lives" aria-label="失误次数">
                <i></i><i></i><i></i>
              </span>
            </header>
            <div class="sk-grid" id="sk-grid" role="grid" aria-label="数独棋盘"></div>
            <div class="sk-pad">
              <div class="sk-nums" id="sk-nums"></div>
              <div class="sk-tools">
                <button type="button" class="sk-btn" id="sk-undo" title="撤销上一步">↩ 撤销</button>
                <button type="button" class="sk-btn" id="sk-erase" title="清除所选格">⌫ 擦除</button>
                <button type="button" class="sk-btn" id="sk-note" aria-pressed="false" title="铅笔笔记开关（N）">✏ 笔记</button>
                <button type="button" class="sk-btn" id="sk-hint" title="填入正确答案（每局 3 次）">💡 提示 ×3</button>
                <button type="button" class="sk-btn" id="sk-best" title="我的最快纪录">🏆 记录</button>
                <button type="button" class="sk-btn" id="sk-fs" title="全屏">⛶ 全屏</button>
              </div>
            </div>
          </div>

          <!-- 难度选择：点击开新局 -->
          <div class="sk-diffs" role="group" aria-label="难度">
            <button type="button" class="sk-diffbtn on" data-diff="easy">入门</button>
            <button type="button" class="sk-diffbtn" data-diff="medium">进阶</button>
            <button type="button" class="sk-diffbtn" data-diff="hard">困难</button>
            <button type="button" class="sk-diffbtn" data-diff="expert">专家</button>
          </div>

          <p class="sk-tip">点格选中 → 数字键或下方键作答；✏ 笔记模式写候选数；键盘方向键可移动，N 切笔记，⌫ 擦除</p>

          <!-- 现代卡片式对话框（胜利 / 失败 / 新纪录 / 纪录）。
               放在 .sk-stage 里面：全屏时 stage 是顶层元素，放在外面的弹窗根本不会显示。 -->
          <div class="sk-modal" id="sk-modal" hidden>
            <div class="sk-card" role="dialog" aria-modal="true" aria-labelledby="sk-card-title">
              <h3 id="sk-card-title"></h3>
              <div class="sk-card-body" id="sk-card-body"></div>
            </div>
          </div>
        </div>

        <!-- 右侧全站英雄榜：四档难度各自的最快纪录 -->
        <aside class="sk-lb" aria-label="全站数独英雄榜">
          <div class="sk-lb-head">
            <h2>英雄榜</h2>
            <span class="sk-lb-note" id="sk-lb-note">云端</span>
          </div>
          <div class="sk-lb-tabs" role="tablist" aria-label="难度">
            <button type="button" class="sk-lb-tab on" data-diff="easy" role="tab" aria-selected="true">入门</button>
            <button type="button" class="sk-lb-tab" data-diff="medium" role="tab" aria-selected="false">进阶</button>
            <button type="button" class="sk-lb-tab" data-diff="hard" role="tab" aria-selected="false">困难</button>
            <button type="button" class="sk-lb-tab" data-diff="expert" role="tab" aria-selected="false">专家</button>
          </div>
          <ol class="sk-lb-list" id="sk-lb-list"></ol>
          <div class="sk-lb-foot">
            <span>全站共享 · 每人只计最快</span>
            <button type="button" class="sk-lb-refresh" id="sk-lb-refresh">刷新</button>
          </div>
        </aside>
      </div>
    </div>
  </main>
  <script type="module" src="app.js?v=4"></script>
  <script type="module" src="../../assets/js/site-gate.js"></script>
  <script>
    /* 主题切换：写回主站同一套 localStorage 键，回到主站后主题保持一致 */
    (function () {
      var btn = document.getElementById('tool-theme');
      if (!btn) return;
      function apply(dark) {
        var root = document.documentElement;
        root.classList.toggle('dark', dark);
        root.dataset.theme = dark ? 'dark' : 'light';
        var m = document.querySelector('meta[name="theme-color"]');
        if (m) m.content = dark ? '#12181a' : '#f2f5f4';
        try { localStorage.setItem('theme', dark ? 'dark' : 'light'); } catch (e) {}
      }
      btn.addEventListener('click', function () {
        apply(!document.documentElement.classList.contains('dark'));
      });
    })();
  </script>
</body>
</html>
