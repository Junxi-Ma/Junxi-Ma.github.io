<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 — Michael</title>
  <meta name="theme-color" content="#0a0a0b">
  <meta name="robots" content="noindex">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230a0a0b'/%3E%3Cpath d='M16 46V18h6.2l9.8 17.6L41.8 18H48v28h-6.4V29.6L32.6 44h-1.2L22.4 29.6V46z' fill='%23f2a93b'/%3E%3C/svg%3E">
  <!-- 404 页面在任意深度的缺失路径上被服务，
       外部 CSS/JS 的相对路径会全部失效 → 必须完全自包含（含主题） -->
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    /* 默认暗色 */
    :root, html[data-theme="dark"] {
      color-scheme: dark;
      --bg: #0a0a0b;
      --text: #f4f4f5;
      --text-2: #a1a1aa;
      --accent: #f2a93b;
      --accent-fill: #f2a93b;
      --accent-fill-hover: #ffc061;
      --accent-fg: #1a1206;
    }
    html[data-theme="light"] {
      color-scheme: light;
      --bg: #faf8f5;
      --text: #1c1917;
      --text-2: #57534e;
      --accent: #9a5b06;
      --accent-fill: #f0a52e;
      --accent-fill-hover: #e09612;
      --accent-fg: #241703;
    }

    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      text-align: center;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto,
        "PingFang SC", "Microsoft YaHei", sans-serif;
      padding: 32px;
      transition: background 0.2s ease, color 0.2s ease;
    }
    .code {
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: clamp(56px, 12vw, 112px);
      font-weight: 500;
      letter-spacing: -0.03em;
      line-height: 1;
    }
    .code span { color: var(--accent); }
    p {
      margin-top: 22px;
      color: var(--text-2);
      line-height: 1.7;
    }
    .btn {
      display: inline-block;
      margin-top: 34px;
      padding: 12px 24px;
      font-size: 15px;
      font-weight: 550;
      color: var(--accent-fg);
      background: var(--accent-fill);
      border-radius: 10px;
      text-decoration: none;
      transition: background 0.2s ease, transform 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .btn:hover { background: var(--accent-fill-hover); transform: translateY(-1px); }
    a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
    @media (prefers-reduced-motion: reduce) {
      body, .btn { transition: none; }
    }
  </style>
  <script>
    /* 首帧前定下主题（与全站 localStorage 键一致） */
    (function () {
      var t = null;
      try { t = localStorage.getItem('site-theme'); } catch (e) {}
      if (t !== 'dark' && t !== 'light') t = 'dark';
      document.documentElement.dataset.theme = t;
      var m = document.querySelector('meta[name="theme-color"]');
      if (m) m.content = t === 'light' ? '#faf8f5' : '#0a0a0b';
    })();
  </script>
</head>
<body>
  <main>
    <div class="code">404 <span>/</span> Not Found</div>
    <p>这个地址不存在 —— 可能是链接过期，或者我把它挪了地方。</p>
    <a class="btn" id="home" href="/">回到首页</a>
  </main>

  <script>
    // 404 会被服务在任意路径深度下，相对链接会解析错位置。
    // 向上探测根目录的 index.html（最多 3 层），兼容：
    //   user.github.io / user.github.io/repo / 任意深度的错误路径
    (function () {
      var candidates = ['index.html', '../index.html', '../../index.html', '../../../index.html'];
      var i = 0;
      function next() {
        if (i >= candidates.length) return; // 保底：保持 href="/"
        var url = candidates[i++];
        fetch(url, { method: 'HEAD' })
          .then(function (res) {
            if (res.ok) {
              document.getElementById('home').setAttribute('href', url);
            } else {
              next();
            }
          })
          .catch(next);
      }
      next();
    })();
  </script>
</body>
</html>
