# 构建 Astro 站点并部署到 GitHub Pages
#
# 为什么在 CI 里构建而不是提交 dist/：
#   · Astro 需要 Node 侧编译（图片优化、字体子集化、Pagefind 索引），
#     这些产物提交进仓库既大又容易冲突
#   · 让每次部署都由当时的仓库内容现场生成，任何提交方式都不会漏
#
# 2026-11 前端迁移：从「零框架静态站 + python 生成索引」改成
# 「Astro 构建 + dist 部署」。工具页与分支页仍是静态资源，
# 放在 public/ 下，由 Astro 原样复制进 dist，路径不变。
#
# 前置设置（一次性）：仓库 Settings → Pages → Source 选 "GitHub Actions"。

name: 构建并部署站点

on:
  push:
    branches: [main]
  workflow_dispatch:

# GITHUB_TOKEN 的最小权限：读代码、写 Pages、签发 OIDC
permissions:
  contents: read
  pages: write
  id-token: write

# 同一时刻只跑一个部署；不取消进行中的部署，避免线上出现半个版本
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: 构建站点
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      # pnpm 版本跟 package.json 的 packageManager 字段保持一致
      - name: 准备 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.22.0

      - name: 准备 Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: 准备 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 检查笔记排版
        # 只提示、不拦截：网页端直接改 Markdown 时也能在日志里看到问题，
        # 但不让排版小问题挡住部署。notes/ 现在只是源文件留档，
        # 真正发布的是 src/content/posts/。
        continue-on-error: true
        run: python scripts/lint_notes.py

      - name: 安装依赖
        # lockfile 是模板带过来的，依赖集合没动过，可以 frozen
        run: pnpm install --frozen-lockfile

      - name: 构建
        # 构建链路见 package.json 的 build 脚本：
        #   astro build → 裁剪看板娘资源 → 字体子集化 → 压缩内联脚本 → Pagefind 索引
        # 其中 Pagefind 必须在 astro build 之后跑，它要扫描已生成的 HTML。
        env:
          ASTRO_TELEMETRY_DISABLED: "1"
        run: pnpm build

      - name: 配置 Pages
        uses: actions/configure-pages@v5

      - name: 打包站点
        uses: actions/upload-pages-artifact@v3
        with:
          # 只上传构建产物。工具页、分支页、.nojekyll 都在 public/ 下，
          # 已由 Astro 复制进 dist，不需要额外处理。
          path: dist

  deploy:
    name: 部署
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 部署到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
