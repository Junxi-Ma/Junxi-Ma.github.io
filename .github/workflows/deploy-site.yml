# 部署流程（方案 B：CI 构建 + Actions 制品部署）
#
# push → 生成内容索引 → 打包整个站点 → 部署到 GitHub Pages。
# 一次性设置：Settings → Pages → Source 选 “GitHub Actions”。
#
# 注意：
# - 提交信息里不要写 [skip ci]，它会把 Pages 部署一起跳过
# - 本 workflow 使用 GITHUB_TOKEN，不会自我触发循环

name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 部署类并发：不取消进行中的部署，排队执行
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate content index
        run: python3 scripts/build_index.py

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
