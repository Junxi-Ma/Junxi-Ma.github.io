<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>笔记 — Michael</title>
  <meta name="description" content="Michael 的学习笔记。">
  <meta name="theme-color" content="#0a0a0b">
  <meta name="color-scheme" content="dark">
  <link rel="icon" type="image/svg+xml" href="assets/img/favicon.svg">
  <link rel="stylesheet" href="assets/css/tokens.css">
  <link rel="stylesheet" href="assets/css/main.css">
  <link rel="stylesheet" href="assets/css/markdown.css?v=2">
  <link rel="stylesheet" href="assets/vendor/katex/katex.min.css">
  <script>
    /* 首帧前定下主题，避免闪烁；无记录时默认暗色（站点基调） */
    (function () {
      var t = null;
      try { t = localStorage.getItem('site-theme'); } catch (e) {}
      if (t !== 'dark' && t !== 'light') t = 'dark';
      document.documentElement.dataset.theme = t;
      document.documentElement.classList.add('js');
      var m = document.querySelector('meta[name="theme-color"]');
      if (m) m.content = t === 'light' ? '#faf8f5' : '#0a0a0b';
    })();
  </script>
  <link rel="stylesheet" href="assets/css/site-gate.css">
  <script>document.documentElement.dataset.gateCheck = "1";</script>
</head>
<body>
  <a class="skip-link" href="#main">跳到主要内容</a>
  <div class="progress" id="progress" aria-hidden="true"></div>

  <!-- 阅读页刻意不设站点导航栏（返回入口在下方「← 全部笔记」），仅保留右上角主题切换 -->
  <div class="reading-actions">
    <button class="nav__icon" id="theme-toggle" type="button" aria-label="切换到浅色模式" title="浅色模式">
      <svg class="ico-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true">
        <circle cx="12" cy="12" r="4"/>
        <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/>
      </svg>
      <svg class="ico-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
      </svg>
    </button>
  </div>

  <noscript>
    <div class="ns-banner">阅读笔记需要 JavaScript（用于获取并渲染 Markdown 文件），请启用后刷新。</div>
  </noscript>

  <main id="main">
    <div class="container">
      <div class="article-head">
        <a class="article-back" href="notes.html"><span class="arr">←</span>全部笔记</a>
        <div id="note-head-loading">
          <div class="skel skel-line skel-line--title"></div>
          <div class="skel skel-line skel-line--w60" style="height: 15px;"></div>
        </div>
        <h1 id="note-title" hidden></h1>
        <div class="article-meta" id="note-meta" hidden></div>
        <div class="article-tags" id="note-tags" hidden></div>
      </div>

      <div class="article-grid">
        <article class="markdown" id="note-body" aria-live="polite">
          <div class="skel skel-line skel-line--w95"></div>
          <div class="skel skel-line skel-line--w80"></div>
          <div class="skel skel-line skel-line--w95"></div>
          <div class="skel skel-line skel-line--w60"></div>
          <div class="skel skel-line skel-line--w95"></div>
          <div class="skel skel-line skel-line--w80"></div>
        </article>
        <aside class="toc" id="toc" hidden aria-label="文章目录"></aside>
      </div>
    </div>
  </main>

  <footer class="footer">
    <div class="container footer__inner">
      <span>© <span data-year>2026</span> Michael · <span class="footer__heart">♥</span> 手工打造 · 动静结合</span>
      <nav class="footer__links" aria-label="页脚导航">
        <a href="tools.html">Tools</a>
        <a href="notes.html">Notes</a>
        <a href="https://github.com/" target="_blank" rel="noopener noreferrer">GitHub</a>
      </nav>
    </div>
  </footer>

  <!-- 经典脚本先行：模块脚本（defer 语义）执行时以下全局已就绪 -->
  <script src="assets/vendor/marked.umd.min.js"></script>
  <script src="assets/vendor/purify.min.js"></script>
  <script src="assets/vendor/highlight.min.js"></script>
  <script src="assets/vendor/katex/katex.min.js"></script>
  <script src="assets/vendor/katex/contrib/auto-render.min.js"></script>
  <script type="module" src="assets/js/main.js"></script>
  <script type="module" src="assets/js/note.js"></script>
  <script type="module" src="assets/js/site-gate.js"></script>
</body>
</html>
