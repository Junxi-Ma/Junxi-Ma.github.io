        <h1>纸感数独</h1>
        <p>现代纸感设计的数独棋盘：四档难度全部唯一解，铅笔笔记、提示、撤销与三次失误上限。登录后成绩自动署名上云，右侧英雄榜收录全站四档的最快纪录；手机与平板点按即可作答。</p>
      </div>

      <div class="sk-layout">
        <div class="sk-stage">
          <!-- 纸张质感的数独纸 -->
          <div class="sk-sheet" id="sk-sheet">
            <header class="sk-head">
              <span class="sk-diff" id="sk-diff-label">入门</span>
              <span class="sk-timer" id="sk-timer">00:00</span>
              <span class="sk-lives" id="sk-lives" aria-label="失误次数">
                <i></i><i></i><i></i>
              </span>
            </header>
            <div class="sk-grid" id="sk-grid" role="grid" aria-label="数独棋盘"></div>
            <div class="sk-pad">
              <div class="sk-nums" id="sk-nums"></div>
              <div class="sk-tools">
                <button type="button" class="sk-btn" id="sk-undo" title="撤销上一步">↩ 撤销</button>
                <button type="button" class="sk-btn" id="sk-erase" title="清除所选格">⌫ 擦除</button>
                <button type="button" class="sk-btn" id="sk-note" aria-pressed="false" title="铅笔笔记开关（N）">✏ 笔记</button>
                <button type="button" class="sk-btn" id="sk-hint" title="填入正确答案（每局 3 次）">💡 提示 ×3</button>
                <button type="button" class="sk-btn" id="sk-best" title="我的最快纪录">🏆 记录</button>
                <button type="button" class="sk-btn" id="sk-fs" title="全屏">⛶ 全屏</button>
              </div>
            </div>
          </div>

          <!-- 难度选择：点击开新局 -->
          <div class="sk-diffs" role="group" aria-label="难度">
            <button type="button" class="sk-diffbtn on" data-diff="easy">入门</button>
            <button type="button" class="sk-diffbtn" data-diff="medium">进阶</button>
            <button type="button" class="sk-diffbtn" data-diff="hard">困难</button>
            <button type="button" class="sk-diffbtn" data-diff="expert">专家</button>
          </div>

          <p class="sk-tip">点格选中 → 数字键或下方键作答；✏ 笔记模式写候选数；键盘方向键可移动，N 切笔记，⌫ 擦除</p>
        </div>

        <!-- 右侧全站英雄榜：四档难度各自的最快纪录 -->
        <aside class="sk-lb" aria-label="全站数独英雄榜">
          <div class="sk-lb-head">
            <h2>英雄榜</h2>
            <span class="sk-lb-note" id="sk-lb-note">云端</span>
          </div>
          <div class="sk-lb-tabs" role="tablist" aria-label="难度">
            <button type="button" class="sk-lb-tab on" data-diff="easy" role="tab" aria-selected="true">入门</button>
            <button type="button" class="sk-lb-tab" data-diff="medium" role="tab" aria-selected="false">进阶</button>
            <button type="button" class="sk-lb-tab" data-diff="hard" role="tab" aria-selected="false">困难</button>
            <button type="button" class="sk-lb-tab" data-diff="expert" role="tab" aria-selected="false">专家</button>
          </div>

          <div class="sk-lb-foot">
            <span>全站共享 · 每人只计最快</span>
