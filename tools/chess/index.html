        <button class="nav__icon" id="theme-toggle" type="button" aria-label="切换到浅色模式" title="浅色模式">

  <main id="main">
    <div class="container tool">
      <div class="tool__head">
        <a class="article-back" href="../../tools.html"><span class="arr">←</span>全部工具</a>
        <p class="mono-label">Tool <span>/</span> 09</p>
        <h1>棋乐馆</h1>
        <p>选择对局模式进入全屏棋盘：人机对弈内置 α-β 剪枝搜索的四档 AI，双人联机以房间码即邀请函，走子实时同步，完整规则判定（易位、吃过路兵、升变、将杀、逼和与和棋）。</p>
      </div>

      <!-- 启动器：选择模式 -->
      <div class="ch-launcher" id="ch-launcher">
        <div class="ch-cards">
        <div class="ch-card-big ch-select">
          <p class="ch-label">棋类</p>
          <div class="ch-chips big" id="sel-kind">
            <button type="button" class="ch-chip on" data-v="chess">国际象棋</button>
            <button type="button" class="ch-chip" data-v="xiangqi">中国象棋</button>
            <button type="button" class="ch-chip" data-v="gomoku">五子棋</button>
            <button type="button" class="ch-chip" data-v="go">围棋</button>
          </div>
          <p class="ch-label">对局模式</p>
          <div class="ch-chips big" id="sel-mode">
            <button type="button" class="ch-chip on" data-v="ai">人机对弈</button>
            <button type="button" class="ch-chip" data-v="local">双人同屏</button>
            <button type="button" class="ch-chip" data-v="online" id="sel-mode-online">联机房间</button>
          </div>
          <p class="ch-label" id="sel-diff-label">AI 难度</p>
          <div class="ch-chips" id="sel-diff"></div>
          <div id="sel-side-wrap">
            <p class="ch-label">我执</p>
            <div class="ch-chips" id="sel-side">
              <button type="button" class="ch-chip on" data-v="w">执白先行</button>
              <button type="button" class="ch-chip" data-v="b">执黑</button>
            </div>
          </div>
          <div id="sel-online-wrap" hidden>
            <button type="button" class="ch-btn primary wide" id="ch-create">✚ 创建房间</button>
            <p class="ch-label" style="margin-top:12px">已有房间码？在此加入</p>
            <div class="ch-joinrow">
              <input class="ch-code-input" id="ch-code-input" maxlength="5" placeholder="房间码" autocomplete="off">
              <button type="button" class="ch-btn" id="ch-join">加入</button>
            </div>
            <p class="ch-label" style="margin-top:10px">不输码则创建新房间</p>
          </div>
          <button type="button" class="ch-btn primary wide" id="ch-start">开始对弈 →</button>
        </div>
      </div>
        <p class="ch-tip">完整规则：王车易位、吃过路兵、升变、将杀、逼和与和棋判定｜对局内可悔棋、认输、翻转、真全屏</p>
      </div>
    </div>
  </main>

  <!-- 对局视图：铺满整屏的棋盘 -->
  <div class="ch-game" id="ch-game" hidden>
    <div class="ch-topbar">
      <button type="button" class="ch-tbtn" id="ch-exit" title="退出对局">← 退出</button>
      <span class="ch-modechip" id="ch-modechip">人机</span>
      <span class="ch-status" id="ch-status"></span>
      <span class="ch-spacer"></span>
      <span class="ch-roomchip" id="ch-roomchip" hidden></span>
      <span class="ch-clock" id="ch-clock"></span>
      <button type="button" class="ch-tbtn" id="ch-restart" title="重开本局">⟳ 重开</button>
      <button type="button" class="ch-tbtn" id="ch-undo" title="悔棋（人机模式）">悔棋</button>
      <button type="button" class="ch-tbtn" id="ch-resign" title="认输">认输</button>
      <button type="button" class="ch-tbtn" id="ch-pass" title="停一手（围棋）" hidden>停一手</button>
      <button type="button" class="ch-tbtn" id="ch-flip" title="翻转棋盘">翻转</button>
      <button type="button" class="ch-tbtn" id="ch-theme" title="切换日 / 夜">☀</button>
      <button type="button" class="ch-tbtn" id="ch-fs" title="真全屏（隐藏浏览器界面）">⛶</button>
    </div>
    <div class="ch-capstrip" id="ch-cap-top" aria-label="黑方被吃子"></div>
    <div class="ch-boardframe">
      <div class="ch-board" id="ch-board" role="grid" aria-label="国际象棋棋盘"></div>
    </div>
    <div class="ch-capstrip" id="ch-cap-bottom" aria-label="白方被吃子"></div>
  </div>

  <!-- 升变选择 -->
  <div class="ch-modal" id="ch-promo" hidden>
    <div class="ch-promo-card">
      <p class="ch-label" style="text-align:center">选择升变</p>
      <div class="ch-promo-row" id="ch-promo-row"></div>
    </div>
  </div>

  <!-- 结果对话框 -->
  <div class="ch-modal" id="ch-modal" hidden>
    <div class="ch-card" role="dialog" aria-modal="true" aria-labelledby="ch-card-title">
      <h3 id="ch-card-title"></h3>
      <p id="ch-card-text"></p>
      <div class="ch-actions">
        <button type="button" class="ch-btn primary" id="ch-card-ok">好的</button>
      </div>
    </div>
  </div>

</body>
</html>
