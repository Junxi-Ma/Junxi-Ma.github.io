        <p>粘贴 JSON 即可实时校验；格式化、压缩一键完成，解析错误直接定位到行列。所有数据只在你的浏览器里处理。</p>

      <div class="tool__status" id="status" role="status" aria-live="polite">

  <script>
    (() => {
      const input = document.getElementById('input');
      const status = document.getElementById('status');
      const statusMsg = document.getElementById('status-msg');
      const statusStats = document.getElementById('status-stats');
      const indentSel = document.getElementById('indent');

      /* 状态一律用 textContent 构建 —— JSON.parse 的报错消息会
         携带输入内容片段，绝不能走 innerHTML */
      function setStatus(kind, msg, stats) {
        status.classList.remove('is-ok', 'is-err');
        input.classList.remove('is-err');
        if (kind) status.classList.add(`is-${kind}`);
        if (kind === 'err') input.classList.add('is-err');

        const dot = document.createElement('span');
        dot.className = 'dot';
        statusMsg.replaceChildren(dot, document.createTextNode(msg));
        statusStats.textContent = stats || 'Ctrl + Enter 快速格式化';
      }

      /* 解析 V8 / SpiderMonkey 的报错消息 → 行列 */
      function locate(message, text) {
        const direct = message.match(/line (\d+) column (\d+)/i);
        if (direct) return `第 ${direct[1]} 行，第 ${direct[2]} 列`;
        const pos = message.match(/position (\d+)/i);
        if (pos) {
          const p = Math.min(Number(pos[1]), text.length);
          const before = text.slice(0, p);
          const line = before.split('\n').length;
          const col = p - before.lastIndexOf('\n');
          return `第 ${line} 行，第 ${col} 列`;
        }
        return '';
      }

      function tryParse(text, { format, indent } = {}) {
        if (!text.trim()) {
          setStatus('', '等待输入 — 粘贴或键入 JSON 开始校验');
          return false;
        }
        try {
          const value = JSON.parse(text);
          if (format) {
            const space = indent === '\\t' ? '\t' : Number(indent);
            text = JSON.stringify(value, null, space);
            input.value = text;
          }
          const bytes = new TextEncoder().encode(text).length;
          const lines = text.split('\n').length;
          const type = Array.isArray(value) ? 'array' : value === null ? 'null' : typeof value;
          setStatus('ok', `✓ 合法 JSON（${type}）`, `${lines} 行 · ${bytes} bytes`);
          return true;
        } catch (e) {
          const where = locate(String(e.message), text);
          setStatus('err', `✕ 解析失败${where ? ' — ' + where : ''}`, String(e.message).slice(0, 120));
          return false;
        }
      }

      let debounce;
      input.addEventListener('input', () => {
        clearTimeout(debounce);
        debounce = setTimeout(() => tryParse(input.value), 200);
      });

      function apply(fn) {
        clearTimeout(debounce);
        fn();
      }

      const doFormat = () =>
        apply(() => tryParse(input.value, { format: true, indent: indentSel.value }));

      input.addEventListener('keydown', (e) => {
        if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
          e.preventDefault();
          doFormat();
        }
      });

      document.getElementById('btn-format').addEventListener('click', doFormat);

      document.getElementById('btn-minify').addEventListener('click', () =>
        apply(() => {
          try {
            input.value = JSON.stringify(JSON.parse(input.value));
          } catch {
            /* 解析失败 → 保持原文，交给下面的 tryParse 报错定位 */
          }
          tryParse(input.value);
        })
      );

      document.getElementById('btn-copy').addEventListener('click', async (e) => {
        const btn = e.currentTarget;
        if (!input.value) return;
        try {
          await navigator.clipboard.writeText(input.value);
        } catch {
          input.select();
          document.execCommand('copy');
        }
        const old = btn.textContent;
        btn.textContent = '已复制 ✓';
        setTimeout(() => (btn.textContent = old), 1400);
      });

      document.getElementById('btn-clear').addEventListener('click', () => {
        apply(() => {
          input.value = '';
          input.focus();
          setStatus('', '等待输入 — 粘贴或键入 JSON 开始校验');
        });
      });
    })();
  </script>
