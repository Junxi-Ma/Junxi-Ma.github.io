<!DOCTYPE html>

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>魔方还原助手 — Michael</title>
  <meta name="description" content="输入当前魔方各面颜色，自动校验合法性并给出还原步骤，支持三维动画逐步演示。">
  <meta name="theme-color" content="#0a0a0b">
  <meta name="color-scheme" content="dark">
  <link rel="icon" type="image/svg+xml" href="../../assets/img/favicon.svg">
  <script>
    /* 首帧前定下主题，避免闪烁；无记录时默认暗色（站点基调） */
    (function () {
      var t = null;
      try { t = localStorage.getItem('site-theme'); } catch (e) {}
      if (t !== 'dark' && t !== 'light') t = 'dark';
      document.documentElement.dataset.theme = t;
      document.documentElement.classList.add('js');
      var m = document.querySelector('meta[name="theme-color"]');
      if (m) m.content = t === 'light' ? '#faf8f5' : '#0a0a0b';
    })();
  </script>
  <link rel="stylesheet" href="../../assets/css/tokens.css">
  <link rel="stylesheet" href="../../assets/css/main.css">
  <link rel="stylesheet" href="style.css?v=7">
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"
    }
  }
  </script>
</head>
<body>
  <a class="skip-link" href="#main">跳到主要内容</a>

  <header class="nav" id="nav">
    <div class="container nav__inner">
      <a class="nav__logo" href="../../index.html" aria-label="Michael 首页">Michael<i>.</i></a>
      <nav class="nav__links" id="nav-links" aria-label="主导航">
        <a href="../../index.html">首页</a>
        <a href="../../tools.html" aria-current="page">工具</a>
        <a href="../../notes.html">笔记</a>
        <a href="../../index.html#about">关于</a>
      </nav>
      <div class="nav__actions">
        <button class="nav__icon" id="theme-toggle" type="button" aria-label="切换到浅色模式" title="浅色模式">
          <svg class="ico-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true">
            <circle cx="12" cy="12" r="4"/>
            <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/>
          </svg>
          <svg class="ico-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
          </svg>
        </button>
        <button class="nav__toggle" id="nav-toggle" aria-label="打开菜单" aria-expanded="false" aria-controls="nav-links">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true">
            <path d="M4 7h16M4 12h16M4 17h16"/>
          </svg>
        </button>
      </div>
    </div>
  </header>

  <main id="main">
    <div class="container tool">
      <div class="tool__head">
        <a class="article-back" href="../../tools.html"><span class="arr">←</span>全部工具</a>
        <p class="mono-label">Tool <span>/</span> 05</p>
        <h1>魔方还原助手</h1>
        <p>在展开图上涂出魔方现状，自动校验合法性并给出还原步骤，三维动画逐步演示。标准配色之外，换过配色或换过持握方向的魔方也能输入。</p>
      </div>

      <div class="cs-toolbar">
        <button type="button" class="btn btn-primary" id="btn-solve">验证并求解</button>
        <button type="button" class="btn" id="btn-scramble">随机打乱</button>
        <button type="button" class="btn" id="btn-reset">复原状态</button>
        <span class="cs-spacer"></span>
        <span class="cs-face-legend" id="face-legend"></span>
      </div>

      <div class="cs-main">
        <!-- 左侧：3D 视图 -->
        <section class="cs-pane cs-3d-pane">
          <div class="cs-3d-stage" id="stage">
            <div class="cs-3d-hint">拖拽旋转 · 滚轮缩放</div>
          </div>
          <div class="cs-status" id="status">在展开图上涂出当前魔方状态</div>
        </section>

        <!-- 右侧：输入与控制 -->
        <section class="cs-pane cs-input-pane">
          <div class="cs-block">
            <h2>颜色</h2>
            <p class="cs-tip">点选颜色后，点击展开图上的贴纸涂色；右键（长按）可循环切换颜色。六块中心贴纸决定各面的颜色归属。</p>
            <div class="cs-palette" id="palette"></div>
          </div>

          <div class="cs-block">
            <h2>展开图（输入状态）</h2>
            <div class="cs-net" id="net"></div>
          </div>
        </section>
      </div>

      <!-- 求解步骤区 -->
      <section class="cs-solution" id="solution" hidden>
        <div class="cs-solution-head">
          <h2>还原步骤 <span class="cs-solution-meta" id="solution-meta"></span></h2>
          <div class="cs-solution-controls">
            <button type="button" class="btn" id="btn-prev">◀ 上一步</button>
            <button type="button" class="btn" id="btn-next">下一步 ▶</button>
            <button type="button" class="btn" id="btn-play">▶ 自动播放</button>
            <label class="cs-speed">
              速度
              <input type="range" id="speed" min="120" max="900" value="380" step="20">
            </label>
            <button type="button" class="btn" id="btn-jump-start">回到开头</button>
          </div>
        </div>
        <div class="cs-solution-body">
          <div class="cs-current-move" id="current-move">—</div>
          <div class="cs-move-list" id="move-list"></div>
        </div>
      </section>
    </div>
  </main>

  <footer class="footer">
    <div class="container footer__inner">
      <span>© <span data-year>2026</span> Michael · <span class="footer__heart">♥</span> 纯静态手工打造</span>
      <nav class="footer__links" aria-label="页脚导航">
        <a href="../../tools.html">Tools</a>
        <a href="../../notes.html">Notes</a>
        <a href="https://github.com/" target="_blank" rel="noopener noreferrer">GitHub</a>
      </nav>
    </div>
  </footer>

  <script type="module" src="../../assets/js/main.js"></script>
  <script type="module" src="app.js?v=7"></script>
</body>
</html>
